name: Выкладка на ihc.ru

# После каждого push в main файлы сайта заливаются по SSH (rsync) на хостинг ihc.ru:
# в папку боевого домена и в папку технического адреса (на нём проверяем без домена).
# Логин и пароль хостинга хранятся только в секретах репозитория: FTP_USER, FTP_PASSWORD (они же для SSH).
# Сайты лежат в /home/p1068934/www/<домен>/. Папки, которых ещё нет на хостинге, пропускаются.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ihc
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HOST: p1068934.ftp.ihc.ru
      SSHPASS: ${{ secrets.FTP_PASSWORD }}
      USER: ${{ secrets.FTP_USER }}
    steps:
      - uses: actions/checkout@v4
      - name: Подготовка
        run: |
          sudo apt-get install -y -qq sshpass rsync >/dev/null
          mkdir -p ~/.ssh && ssh-keyscan -T 20 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Заливка по SSH
        run: |
          SSH="sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30"
          for d in void-digital.ru p1068934.ihc.xyz; do
            if $SSH "$USER@$HOST" "test -d www/$d"; then
              echo "→ www/$d"
              rsync -rlz --delete --checksum -e "$SSH" \
                --exclude '.git*' --exclude '.github/' --exclude 'tests/' --exclude 'scripts/' \
                --exclude 'functions/' --exclude 'legacy-netlify/' --exclude 'README.md' \
                --exclude 'netlify.toml' --exclude '_redirects' --exclude 'lead-config.php' \
                ./ "$USER@$HOST:www/$d/"
            else
              echo "Папки www/$d на хостинге пока нет, пропускаю"
            fi
          done
      - name: Проверка связи с сервера (только коды ответа)
        run: |
          SSH="sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30"
          $SSH "$USER@$HOST" 'for u in https://void-digital-site.pages.dev/api/lead https://void-digital.ru/ https://ya.ru/ https://www.google.com/ https://api.telegram.org/ http://example.com/ https://script.google.com/; do printf "%s " "$u"; curl -s -m 10 -o /dev/null -w "%{http_code}
" "$u"; done; echo "proxy env: ${http_proxy:-нет} ${https_proxy:-нет}"'
